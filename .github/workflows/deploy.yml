name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check_release.outputs.should_deploy }}
      release_version: ${{ steps.check_release.outputs.release_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      - name: Check Release Version Gate
        id: check_release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual workflow dispatch detected. Allowing deployment."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "release_version=manual" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          echo "Commit message: $COMMIT_MSG"

          if echo "$COMMIT_MSG" | grep -iqE "(release|\[deploy\])"; then
            PKG_VERSION=$(node -p "require('./package.json').version")
            echo "Release commit detected. Deploying v$PKG_VERSION."
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "release_version=$PKG_VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git diff --name-only HEAD~1 HEAD | grep -q "package.json"; then
            OLD_VER=$(git show HEAD~1:package.json 2>/dev/null | grep '"version"' | head -n 1 || echo "")
            NEW_VER=$(grep '"version"' package.json | head -n 1 || echo "")
            echo "Previous: $OLD_VER"
            echo "Current:  $NEW_VER"
            if [ "$OLD_VER" != "$NEW_VER" ]; then
              PKG_VERSION=$(node -p "require('./package.json').version")
              echo "Version bump confirmed: v$PKG_VERSION"
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "release_version=$PKG_VERSION" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "::notice::No version bump in package.json. Skipping deployment to protect production."
          echo "should_deploy=false" >> $GITHUB_OUTPUT

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        if: steps.check_release.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
