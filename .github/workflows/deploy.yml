name: Deploy VitePress site to Pages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate Release Version Consistency
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG_VER="${{ github.ref_name }}"
            PKG_VER="v$(node -p "require('./package.json').version")"
            echo "Release Tag: $TAG_VER"
            echo "Package Version: $PKG_VER"
            if [[ "$TAG_VER" != "$PKG_VER" ]]; then
              echo "Error: Release tag ($TAG_VER) does not match package.json ($PKG_VER)!"
              exit 1
            fi
          fi

      - name: Build with VitePress
        run: npm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
